# Custom Cardigann definition for the stack's self-hosted Comet instance
# (stacks/media-server/compose.yaml). It lives in Prowlarr's data dir
# (data/prowlarr/Definitions/Custom) so it's mounted in automatically with
# /config; `just wire` registers the "Comet (Local)" indexer against the
# internal-only service URL http://comet:8000 - no GUI step needed.
#
# This definition models Comet's native Torznab integration (Prowlarr Generic
# Torznab: URL http://comet:8000/torznab, API path /api, no API key) with
# q/imdbid/season/ep passed through as Newznab params and parsed back into
# release attributes (imdb, season/episode, seeders) from Comet's Torznab item
# XML.
#
# Two structural quirks keep this definition single-minded rather than widely
# parametrized:
#   - t is pinned to Comet's generic `search` function. Comet only answers
#     empty-query requests (Sonarr/Radarr indexer validation and RSS sync) with
#     its recent feed when function == "search" and no q/imdbid are given
#     (comet/api/endpoints/torznab.py); t=movie/tvsearch with an empty query
#     always resolve to an empty feed.
#   - cat is pinned to Comet's numeric Newznab ids (2000 Movies / 5000 TV).
#     Comet errors on any non-numeric category. Cardigann refuses pure-numeric
#     `cat:` mapping tokens and requires alphabetic Newznab category names, so
#     the numeric tracker ids are declared explicitly under categorymappings
#     and pinned per search path. With t=search the cat id is what selects the
#     media type (2000 -> movies, 5000 -> TV).
#
# The one intentional deviation from Generic Torznab is the title marker:
# Comet's results are debrid-ready cache candidates, so each release title gets
# a " [DEBRID-CACHED]" suffix that the shipped Recyclarr Direct Play profiles
# score (data/recyclarr/custom-formats/debrid-cached.json), giving Comet
# releases a preference over uncached sources.
id: comet-local
name: Comet (Local)
description: "Custom Prowlarr indexer for the stack's self-hosted Comet search add-on."
language: en-US
type: public
encoding: UTF-8
followredirect: false
testlinktorrent: false
requestDelay: 15
links:
  - http://comet:8000

caps:
  categorymappings:
    - {id: 2000, cat: Movies, desc: "Movies", default: true}
    - {id: 5000, cat: TV, desc: "TV", default: true}
  modes:
    search: [q]
    movie-search: [q, imdbid]
    tv-search: [q, imdbid, season, ep]
  allowrawsearch: false
  allowtvsearchimdb: true

search:
  paths:
    - path: /torznab/api
      method: get
      response:
        type: xml
      categories: [2000]
      inputs:
        t: "search"
        q: "{{ .Keywords }}"
        cat: "2000"
        imdbid: "{{ .Query.IMDBID }}"

    - path: /torznab/api
      method: get
      response:
        type: xml
      categories: [5000]
      inputs:
        t: "search"
        q: "{{ .Keywords }}"
        cat: "5000"
        imdbid: "{{ .Query.IMDBID }}"
        season: "{{ .Query.Season }}"
        ep: "{{ .Query.Ep }}"

  rows:
    selector: rss > channel > item
    missingAttributeEqualsNoResults: true

  fields:
    category:
      selector: "[name=category]"
      attribute: value
    title:
      selector: title
      filters:
        # Comet's results are debrid-ready cache candidates. Keep this marker
        # in the release title so both Arr applications can score them equally.
        - name: append
          args: " [DEBRID-CACHED]"
    magnet:
      selector: link
    infohash:
      selector: "[name=infohash]"
      attribute: value
    imdbid:
      selector: "[name=imdb]"
      attribute: value
    date:
      selector: pubDate
    size:
      selector: size
    seeders:
      selector: "[name=seeders]"
      attribute: value
      optional: true
      default: 0
    leechers:
      text: "0"
    downloadvolumefactor:
      text: "0"
    uploadvolumefactor:
      text: "1"
