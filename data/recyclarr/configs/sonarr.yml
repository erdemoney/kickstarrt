# Sonarr + Recyclarr: the shipped "Direct Play" + companion "Direct Play (Anime)" quality profiles.
#
# Auto-loaded by recyclarr (files in configs/ load as if passed via --config).
# Applied automatically on first boot and kept in sync daily - nothing to paste
# in the Sonarr UI. Edit this file to tune, then force a sync:
#   docker compose -f stacks/media-server/compose.yaml exec recyclarr recyclarr sync
#
# Two companion profiles from the TRaSH Guides, tailored for this stack: a CPU-only
# VPS. "Direct Play" (regular TV) - ladder is Remux + WEB + Bluray across 2160p
# and 1080p; audio is left unpenalized because audio transcodes are cheap. HEVC
# is NOT penalized - all 4K UHD content is HEVC - so 4K remuxes/encodes are
# grabbable. Anything that would break playback scores -10000 (below the
# profile's minimum score of 0 = never grabbed): exotic codecs (AV1/VP9/VC-1/
# MPEG2), Dolby Vision without an HDR10 fallback, Blu-ray disk images, and
# low-quality/obfuscated release groups.
#
# "Direct Play (Anime)" (companion, assign to anime series) - TRaSH's [Anime]
# Remux-1080p recipe:
# Bluray-1080p Remux and Bluray-1080p are merged into one tier, HDTV is folded into
# the WEB tiers (anime WEB/HDRips often tag themselves HDTV). x265 receives a
# strong preference because H.264 High 10 has uneven client support; x264 releases
# remain eligible. The same -10000 codec/disk-image never-grab rules apply.
# Dubs-only, raw and LQ anime groups are rejected. Streaming-service tie-breakers
# (CR/NF/DSNP/...) are left out to keep the profile lean like Direct Play.
sonarr:
  tv:
    base_url: http://sonarr:8989
    api_key: !secret sonarr_api_key

    # Use the anime table's relaxed minimums so low-bitrate/older anime encodes
    # aren't rejected on size before scoring. Quality definitions are
    # instance-wide in Sonarr, so the 375 MB/min (~50 Mbps average) ceiling
    # applies to both regular and anime profiles. Keep preferred just under the
    # ceiling so larger eligible releases remain favored.
    quality_definition:
      type: anime
      preferred_ratio: 0.99
      qualities:
        - { name: SDTV, max: 375, preferred: 375 }
        - { name: WEBRip-480p, max: 375, preferred: 375 }
        - { name: WEBDL-480p, max: 375, preferred: 375 }
        - { name: DVD, max: 375, preferred: 375 }
        - { name: Bluray-480p, max: 375, preferred: 375 }
        - { name: Bluray-576p, max: 375, preferred: 375 }
        - { name: HDTV-720p, max: 375, preferred: 375 }
        - { name: HDTV-1080p, max: 375, preferred: 375 }
        - { name: WEBRip-720p, max: 375, preferred: 375 }
        - { name: WEBDL-720p, max: 375, preferred: 375 }
        - { name: Bluray-720p, max: 375, preferred: 375 }
        - { name: WEBRip-1080p, max: 375, preferred: 375 }
        - { name: WEBDL-1080p, max: 375, preferred: 375 }
        - { name: Bluray-1080p, max: 375, preferred: 375 }
        - { name: Bluray-1080p Remux, max: 375, preferred: 375 }
        - { name: HDTV-2160p, max: 375, preferred: 375 }
        - { name: WEBRip-2160p, max: 375, preferred: 375 }
        - { name: WEBDL-2160p, max: 375, preferred: 375 }
        - { name: Bluray-2160p, max: 375, preferred: 375 }
        - { name: Bluray-2160p Remux, max: 375, preferred: 375 }

    quality_profiles:
      - name: Direct Play
        upgrade:
          allowed: true
          until_quality: Bluray-2160p Remux
        min_format_score: 0 # anything scoring below 0 (the -10000 rejects) is never grabbed
        min_upgrade_format_score: 1
        reset_unmatched_scores:
          enabled: true # this file owns the profile: unmanaged CF scores reset to 0
        quality_sort: top
        # best ... worst. The ceiling is 2160p Remux (4K upgrades are chased),
        # and the ladder runs all the way down to SDTV so a missing episode is
        # ALWAYS grabbable - completion first, quality second. Once a low-tier
        # release lands, Sonarr keeps upgrading it toward the ceiling for free
        # over Usenet. The junk tiers below stay listed (disabled) so their
        # sort order and cutoff behavior stay deterministic. Sonarr names its
        # remux qualities "Bluray-<res> Remux" (unlike Radarr).
        qualities:
          - name: Bluray-2160p Remux
          - name: WEB 2160p
            qualities: [WEBRip-2160p, WEBDL-2160p]
          - name: Bluray-2160p
          - name: Bluray-1080p Remux
          - name: WEB 1080p
            qualities: [WEBRip-1080p, WEBDL-1080p]
          - name: Bluray-1080p
          - name: HDTV-1080p
          - name: Bluray-720p
          - name: WEB 720p
            qualities: [WEBRip-720p, WEBDL-720p]
          - name: HDTV-720p
          - name: Bluray-576p
          - name: Bluray-480p
          - name: WEB 480p
            qualities: [WEBRip-480p, WEBDL-480p]
          - name: SDTV
          - name: HDTV-2160p
            enabled: false
          - name: Raw-HD
            enabled: false
          - name: DVD
            enabled: false
          - name: Unknown
            enabled: false

      - name: Direct Play (Anime)
        upgrade:
          allowed: true
          # merged group (Bluray-1080p Remux + Bluray-1080p) = the profile's
          # ceiling, so a good BD encode is never "downgraded" off a remux.
          until_quality: Bluray-1080p Remux
        min_format_score: 0 # v0, raws, LQ groups and codec rejects all score below 0
        min_upgrade_format_score: 1 # quality upgrades are gated only by until_quality
        reset_unmatched_scores:
          enabled: true # this file owns the profile: unmanaged CF scores reset to 0
        quality_sort: top
        # best ... worst (TRaSH anime order). Allowed the first nine; the rest
        # stay listed (disabled) for a deterministic sort order. Qualities are
        # merged per the TRaSH guide so scoring works: Bluray-1080p Remux with
        # Bluray-1080p in one tier, and HDTV-1080p/HDTV-720p folded into the WEB
        # tiers (anime WEB/HDRip releases often mislabel themselves HDTV).
        # Bluray-576p/SDTV sit at the bottom as a completion floor so a missing
        # episode is always fillable; Sonarr then climbs back up for free.
        qualities:
          - name: Bluray-1080p Remux
            qualities: [Bluray-1080p Remux, Bluray-1080p]
          - name: Bluray-2160p
          - name: WEBDL-1080p
            qualities: [WEBDL-1080p, WEBRip-1080p, HDTV-1080p]
          - name: Bluray-720p
          - name: WEBDL-720p
            qualities: [WEBDL-720p, WEBRip-720p, HDTV-720p]
          - name: Bluray-576p
          - name: Bluray-480p
          - name: WEB 480p
            qualities: [WEBRip-480p, WEBDL-480p]
          - name: SDTV
          - name: Bluray-2160p Remux
            enabled: false
          - name: HDTV-2160p
            enabled: false
          - name: Raw-HD
            enabled: false
          - name: DVD
            enabled: false
          - name: Unknown
            enabled: false

    custom_formats:
      # --- release-group quality tiers (TRaSH Guide scores) ---
      - trash_ids: [9965a052eb87b0d10313b1cea89eb451] # Remux Tier 01
        assign_scores_to: [{ name: Direct Play, score: 1900 }, { name: Direct Play (Anime), score: 975 }]
      - trash_ids: [8a1d0c3d7497e741736761a1da866a2e] # Remux Tier 02
        assign_scores_to: [{ name: Direct Play, score: 1850 }, { name: Direct Play (Anime), score: 950 }]
      - trash_ids: [d6819cba26b1a6508138d25fb5e32293] # HD Bluray Tier 01
        assign_scores_to: [{ name: Direct Play, score: 1800 }]
      - trash_ids: [c2216b7b8aa545dc1ce8388c618f8d57] # HD Bluray Tier 02
        assign_scores_to: [{ name: Direct Play, score: 1750 }]
      - trash_ids: [e6258996055b9fbab7e9cb2f75819294] # WEB Tier 01
        assign_scores_to: [{ name: Direct Play, score: 1700 }]
      - trash_ids: [58790d4e2fdcd9733aa7ae68ba2bb503] # WEB Tier 02
        assign_scores_to: [{ name: Direct Play, score: 1650 }]
      - trash_ids: [d84935abd3f8556dcd51d4f27e22d0a6] # WEB Tier 03
        assign_scores_to: [{ name: Direct Play, score: 1600 }]

      # --- anime release-group tiers (SeaDex groups, TRaSH anime guide scores) ---
      - trash_ids: [949c16fe0a8147f50ba82cc2df9411c9] # Anime BD Tier 01
        assign_scores_to: [{ name: Direct Play (Anime), score: 1400 }]
      - trash_ids: [ed7f1e315e000aef424a58517fa48727] # Anime BD Tier 02
        assign_scores_to: [{ name: Direct Play (Anime), score: 1300 }]
      - trash_ids: [096e406c92baa713da4a72d88030b815] # Anime BD Tier 03
        assign_scores_to: [{ name: Direct Play (Anime), score: 1200 }]
      - trash_ids: [30feba9da3030c5ed1e0f7d610bcadc4] # Anime BD Tier 04
        assign_scores_to: [{ name: Direct Play (Anime), score: 1100 }]
      - trash_ids: [545a76b14ddc349b8b185a6344e28b04] # Anime BD Tier 05
        assign_scores_to: [{ name: Direct Play (Anime), score: 1000 }]
      - trash_ids: [25d2afecab632b1582eaf03b63055f72] # Anime BD Tier 06
        assign_scores_to: [{ name: Direct Play (Anime), score: 900 }]
      - trash_ids: [0329044e3d9137b08502a9f84a7e58db] # Anime BD Tier 07
        assign_scores_to: [{ name: Direct Play (Anime), score: 800 }]
      - trash_ids: [c81bbfb47fed3d5a3ad027d077f889de] # Anime BD Tier 08
        assign_scores_to: [{ name: Direct Play (Anime), score: 700 }]
      - trash_ids: [e0014372773c8f0e1bef8824f00c7dc4] # Anime Web Tier 01
        assign_scores_to: [{ name: Direct Play (Anime), score: 600 }]
      - trash_ids: [19180499de5ef2b84b6ec59aae444696] # Anime Web Tier 02
        assign_scores_to: [{ name: Direct Play (Anime), score: 500 }]
      - trash_ids: [c27f2ae6a4e82373b0f1da094e2489ad] # Anime Web Tier 03
        assign_scores_to: [{ name: Direct Play (Anime), score: 400 }]
      - trash_ids: [4fd5528a3a8024e6b49f9c67053ea5f3] # Anime Web Tier 04
        assign_scores_to: [{ name: Direct Play (Anime), score: 300 }]
      - trash_ids: [29c2a13d091144f63307e4a8ce963a39] # Anime Web Tier 05
        assign_scores_to: [{ name: Direct Play (Anime), score: 200 }]
      - trash_ids: [dc262f88d74c651b12e9d90b39f6c753] # Anime Web Tier 06
        assign_scores_to: [{ name: Direct Play (Anime), score: 100 }]

      # --- anime versions (subs-vs-batch quality; TRaSH anime guide scores) ---
      - trash_ids: [d2d7b8a9d39413da5f44054080e028a3] # v0: bad batch, reject unless a tier outranks it
        assign_scores_to: [{ name: Direct Play (Anime), score: -51 }]
      - trash_ids: [273bd326df95955e1b6c26527d1df89b] # v1
        assign_scores_to: [{ name: Direct Play (Anime), score: 1 }]
      - trash_ids: [228b8ee9aa0a609463efca874524a6b8] # v2
        assign_scores_to: [{ name: Direct Play (Anime), score: 2 }]
      - trash_ids: [0e5833d3af2cc5fa96a0c29cd4477feb] # v3
        assign_scores_to: [{ name: Direct Play (Anime), score: 3 }]
      - trash_ids: [4fc15eeb8f2f9a749f918217d4234ad8] # v4
        assign_scores_to: [{ name: Direct Play (Anime), score: 4 }]

      # --- strong codec preference: favor HEVC encodes for broader client support ---
      # This is a release-title match, not a guarantee of direct play. Keep H.264
      # eligible and the generic 10-bit format unscored; it also matches H.264 High 10.
      - trash_ids: [c9eafd50846d299b862ca9bb6ea91950] # x265
        assign_scores_to: [{ name: Direct Play (Anime), score: 500 }]

      # --- anime optional: score up if the household prefers these ---
      - trash_ids: [026d5aadd1a6b4e550b134cb6c72b3ca] # Uncensored (0 = tie-break only)
        assign_scores_to: [{ name: Direct Play (Anime), score: 0 }]
      - trash_ids: [b2550eb333d27b75833e25b8c2557b38] # 10bit (0 = tie-break only)
        assign_scores_to: [{ name: Direct Play (Anime), score: 0 }]
      # Big enough to outrank every anime release-group tier (max 1400), so a
      # dual-audio release always beats an otherwise-better sub-only one.
      - trash_ids: [418f50b10f1907201b6cfdf881f467b7] # Anime Dual Audio (prefer over subs-only)
        assign_scores_to: [{ name: Direct Play (Anime), score: 2000 }]

      # --- HDR: direct-plays on HDR clients (SDR-only household? zero these) ---
      - trash_ids: [505d871304820ba7106b693be6fe4a9e] # HDR
        assign_scores_to: [{ name: Direct Play, score: 500 }, { name: Direct Play (Anime), score: 500 }]
      - trash_ids: [0c4b99df9206d2cfac3c05ab897dd62a] # HDR10+ Boost
        assign_scores_to: [{ name: Direct Play, score: 100 }, { name: Direct Play (Anime), score: 100 }]

      # --- prefer repacks over propers (TRaSH Guide scores) ---
      - trash_ids: [ec8fa7296b64e8cd390a1600981f3923] # Repack/Proper
        assign_scores_to: [{ name: Direct Play, score: 5 }, { name: Direct Play (Anime), score: 5 }]
      - trash_ids: [eb3d5cc0a2be0db205fb823640db6a3c] # Repack2
        assign_scores_to: [{ name: Direct Play, score: 6 }, { name: Direct Play (Anime), score: 6 }]
      - trash_ids: [44e7c4de10ae50265753082e5dc76047] # Repack3
        assign_scores_to: [{ name: Direct Play, score: 7 }, { name: Direct Play (Anime), score: 7 }]

      # --- never grab: codec and disk-image rejects ---
      - trash_ids: [85c61753df5da1fb2aab6f2a47426b09] # BR-DISK (disk image)
        assign_scores_to: [{ name: Direct Play, score: -10000 }, { name: Direct Play (Anime), score: -10000 }]
      - trash_ids: [6f808933a71bd9666531610cb8c059cc] # BR-DISK (BTN variant)
        assign_scores_to: [{ name: Direct Play, score: -10000 }, { name: Direct Play (Anime), score: -10000 }]
      - trash_ids: [9b27ab6498ec0f31a3353992e19434ca] # DV (no HDR10 fallback): pink/green or transcode on non-DV clients
        assign_scores_to: [{ name: Direct Play, score: -10000 }, { name: Direct Play (Anime), score: -10000 }]
      - trash_ids: [15a05bc7c1a36e2b57fd628f8977e2fc] # AV1: clients without AV1 decode make Jellyfin transcode (0 if every client decodes it)
        assign_scores_to: [{ name: Direct Play, score: -10000 }, { name: Direct Play (Anime), score: -10000 }]
      - trash_ids: [90501962793d580d011511155c97e4e5] # VP9
        assign_scores_to: [{ name: Direct Play, score: -10000 }, { name: Direct Play (Anime), score: -10000 }]
      - trash_ids: [7470a681e6205243983c4410ee4c920f] # VC-1 (pre-H.264 Blu-ray codec)
        assign_scores_to: [{ name: Direct Play, score: -10000 }, { name: Direct Play (Anime), score: -10000 }]
      - trash_ids: [4aee45b0868229c4fbd8bad3e315f1d0] # MPEG2 (broadcast caps)
        assign_scores_to: [{ name: Direct Play, score: -10000 }, { name: Direct Play (Anime), score: -10000 }]

      # --- never grab: junk groups (TRaSH Guide scores) ---
      - trash_ids: [9c11cd3f07101cdba90a2d81cf0e56b4] # LQ (Low Quality Releases)
        assign_scores_to: [{ name: Direct Play, score: -10000 }, { name: Direct Play (Anime), score: -10000 }]
      - trash_ids: [e2315f990da2e2cbfc9fa5b7a6fcfe48] # LQ (Release Title)
        assign_scores_to: [{ name: Direct Play, score: -10000 }, { name: Direct Play (Anime), score: -10000 }]
      - trash_ids: [e1a997ddb54e3ecbfe06341ad323c458] # Obfuscated
        assign_scores_to: [{ name: Direct Play, score: -10000 }, { name: Direct Play (Anime), score: -10000 }]

      # --- never grab: anime-specific junk ---
      - trash_ids: [b4a1b3d705159cdca36d71e57ca86871] # Anime Raws (no English subs)
        assign_scores_to: [{ name: Direct Play (Anime), score: -10000 }]
      - trash_ids: [e3515e519f3b1360cbfc17651944354c] # Anime LQ Groups
        assign_scores_to: [{ name: Direct Play (Anime), score: -10000 }]
      - trash_ids: [9c14d194486c4014d422adc64092d794] # Dubs Only (sub household)
        assign_scores_to: [{ name: Direct Play (Anime), score: -10000 }]
      - trash_ids: [07a32f77690263bb9fda1842db7e273f] # VOSTFR (French-only subs)
        assign_scores_to: [{ name: Direct Play (Anime), score: -10000 }]
