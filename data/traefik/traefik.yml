# Traefik's STATIC config. This file is tracked and mounted directly by Compose.
# Edit this file; unlike CoreDNS's config, it does not require generation.
#
# The PUBLIC/tailnet bind IPs are NOT set here: the container listeners bind
# container-local ports (:8443 / :443) and stacks/traefik/compose.yaml publishes
# each host IP to its own container listener, so nothing listens on 0.0.0.0.

api:
  dashboard: true
  insecure: false

experimental:
  plugins:
    bouncer:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.4.5

ping: {}

entryPoints:
  http:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: https
          scheme: https
          permanent: true
  # PUBLIC https: published only on PUBLIC_BIND (the IP the provider maps to the
  # internet - the default-route source; on Oracle that's the VNIC private IP the
  # VCN 1:1-NATs to :443, on direct-IP hosts the public IPv4 itself). No panel
  # router is on this entrypoint, so a panel Host: header arriving here gets a
  # 404. Public apps (jellyfin/seerr) use this one.
  https:
    address: ":8443"
    http:
      middlewares:
        # crowdsec first: reject banned IPs before spending rate-limit tokens or
        # adding headers to requests we're about to deny anyway.
        - crowdsec@file
        - secHeaders@file
        - rateLimit@file
  # TAILNET-only https: published only on TAILNET_IP (the box's tailnet address),
  # so it is reachable only by traffic that came through the tailnet - no IP
  # allow-list to attach or forget on each panel router. Panels
  # (radarr/sonarr/prowlarr/bazarr/infinidysk + the traefik dashboard) use this
  # one. Keep CrowdSec and security headers, but omit the generic request-rate
  # limit; tailnet access is already restricted and the limit can reject normal
  # bursts of UI asset requests.
  https-tailnet:
    address: ":443"
    http:
      middlewares:
        - crowdsec@file
        - secHeaders@file

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: "internal"
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

certificatesResolvers:
  cloudflare:
    acme:
      storage: acme.json
      caServer: https://acme-v02.api.letsencrypt.org/directory
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"

accessLog:
  filePath: /var/log/traefik/access.log
  format: json
  fields:
    headers:
      defaultMode: drop
      names:
        User-Agent: keep
