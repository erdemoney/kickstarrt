x-base: &base
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  pids_limit: 512

x-lsio-init: &lsio-init
  <<: *base
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - FOWNER
    - SETGID
    - SETUID

x-puid-init: &puid-init
  <<: *base
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - SETGID
    - SETUID

x-unprivileged: &unprivileged
  <<: *base
  cap_drop:
    - ALL

services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:12.1ubu2604-ls51
    container_name: jellyfin
    <<: *lsio-init
    environment:
      PUID: ${ENV_PUID:-1000}
      PGID: ${ENV_PGID:-1000}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ../../data/jellyfin/config:/config
      - /mnt/usenet:/mnt/usenet
    stop_grace_period: 30s
    tmpfs:
      - /transcode
    # No GPU passthrough here: VPS hosts are CPU-only, so Jellyfin transcodes in
    # software. Keep the library direct-play friendly (see docs/services/jellyfin.md).
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.entrypoints=${JELLYFIN_ENTRYPOINTS:-https-tailnet}"
      - "traefik.http.routers.jellyfin.rule=Host(`${SUB_DOMAIN_JELLYFIN}.${DOMAIN}`)"
      - "traefik.http.routers.jellyfin.tls=true"
      # The default is tailnet-only. `just public enable jellyfin` adds the public
      # entrypoint without requiring a Compose file edit.
      # No crowdsec label on purpose: the entrypoints apply crowdsec@file to every
      # router (see traefik.yml) - attaching it here too would run it twice.
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.0
    container_name: seerr
    <<: *unprivileged
    init: true
    user: ${ENV_PUID:-1000}:${ENV_PGID:-1000}
    environment:
      LOG_LEVEL: info
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ../../data/seerr/config:/app/config
    stop_grace_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.seerr.entrypoints=${SEERR_ENTRYPOINTS:-https-tailnet}"
      - "traefik.http.routers.seerr.rule=Host(`${SUB_DOMAIN_SEERR}.${DOMAIN}`)"
      - "traefik.http.routers.seerr.tls=true"
      - "traefik.http.services.seerr.loadbalancer.server.port=5055"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4
    container_name: radarr
    <<: *lsio-init
    environment:
      PUID: ${ENV_PUID:-1000}
      PGID: ${ENV_PGID:-1000}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ../../data/radarr:/config
      - /mnt/usenet:/mnt/usenet
    stop_grace_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.entrypoints=${RADARR_ENTRYPOINTS:-https-tailnet}"
      - "traefik.http.routers.radarr.rule=Host(`${SUB_DOMAIN_RADARR}.${DOMAIN}`)"
      - "traefik.http.routers.radarr.tls=true"
      # private panel: on the https-tailnet entrypoint, published only on TAILNET_IP
      # (see stacks/traefik/compose.yaml ports + traefik.yml), so it only
      # ever sees traffic that came through the tailnet. No IP allow-list to attach
      # or forget here.
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:7878/ping || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20
    container_name: sonarr
    <<: *lsio-init
    environment:
      PUID: ${ENV_PUID:-1000}
      PGID: ${ENV_PGID:-1000}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ../../data/sonarr:/config
      - /mnt/usenet:/mnt/usenet
    stop_grace_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.entrypoints=${SONARR_ENTRYPOINTS:-https-tailnet}"
      - "traefik.http.routers.sonarr.rule=Host(`${SUB_DOMAIN_SONARR}.${DOMAIN}`)"
      - "traefik.http.routers.sonarr.tls=true"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8989/ping || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.6.5
    container_name: prowlarr
    <<: *lsio-init
    environment:
      PUID: ${ENV_PUID:-1000}
      PGID: ${ENV_PGID:-1000}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ../../data/prowlarr:/config
    stop_grace_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.entrypoints=${PROWLARR_ENTRYPOINTS:-https-tailnet}"
      - "traefik.http.routers.prowlarr.rule=Host(`${SUB_DOMAIN_PROWLARR}.${DOMAIN}`)"
      - "traefik.http.routers.prowlarr.tls=true"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:9696/ping || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  recyclarr:
    # Syncs the shipped TRaSH-tuned "Direct Play" quality profiles to
    # radarr/sonarr (data/recyclarr/configs/*.yml, applied by `just wire`).
    # No web UI, so no traefik labels. Rootless image: user replaces PUID/PGID.
    image: ghcr.io/recyclarr/recyclarr:8.7.2
    container_name: recyclarr
    <<: *unprivileged
    user: ${ENV_PUID:-1000}:${ENV_PGID:-1000}
    depends_on:
      radarr:
        condition: service_healthy
      sonarr:
        condition: service_healthy
    environment:
      CRON_SCHEDULE: "@daily"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ../../data/recyclarr:/config
    # just wire writes /config/secrets.yml after the Arrs are configured. Keep
    # the stock Recyclarr entrypoint; this guard only prevents a noisy restart
    # loop before the first `just wire` run.
    entrypoint: ["/sbin/tini", "--", "/bin/sh", "-c"]
    command:
      - |
        until [ -s /config/secrets.yml ]; do
          sleep 5
        done
        exec /entrypoint.sh
    read_only: true
    tmpfs:
      - /tmp
    # Headless scheduler - no web UI, so no port to ping. The process that keeps
    # the sync schedule alive is supercronic, so healthy == that scheduler is
    # running. The start_period covers the initial `just wire` setup and the
    # time before supercronic appears.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x supercronic || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

  bazarr:
    image: lscr.io/linuxserver/bazarr:1.6.2
    container_name: bazarr
    <<: *lsio-init
    environment:
      PUID: ${ENV_PUID:-1000}
      PGID: ${ENV_PGID:-1000}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ../../data/bazarr/config:/config
      - /mnt/usenet:/mnt/usenet
    stop_grace_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bazarr.entrypoints=${BAZARR_ENTRYPOINTS:-https-tailnet}"
      - "traefik.http.routers.bazarr.rule=Host(`${SUB_DOMAIN_BAZARR}.${DOMAIN}`)"
      - "traefik.http.routers.bazarr.tls=true"
      - "traefik.http.services.bazarr.loadbalancer.server.port=6767"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:6767/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  infinidysk:
    image: ghcr.io/infinidysk/infinidysk:v1.5.1
    container_name: infinidysk
    <<: *puid-init
    environment:
      PUID: ${ENV_PUID:-1000}
      PGID: ${ENV_PGID:-1000}
      FRONTEND_BACKEND_API_KEY: ${INFINIDYSK_API_KEY:-}
      SECURE_COOKIES: "true"
      TRUST_PROXY: "1"
      # InfiniDysk's headless settings overlay is authoritative for these keys.
      NZBDAV_CONFIG__API__KEY: ${INFINIDYSK_API_KEY:-}
      NZBDAV_CONFIG__API__CATEGORIES: "tv,movies"
      NZBDAV_CONFIG__API__IMPORT_STRATEGY: "strm"
      NZBDAV_CONFIG__API__COMPLETED_DOWNLOADS_DIR: "/mnt/usenet/completed-downloads"
      NZBDAV_CONFIG__API__ENSURE_ARTICLE_EXISTENCE_CATEGORIES: "tv,movies"
      NZBDAV_CONFIG__API__ARTICLE_EXISTENCE_CHECK_MODE: "full"
      NZBDAV_CONFIG__GENERAL__BASE_URL: "http://infinidysk:3000"
      NZBDAV_CONFIG__MEDIA__LIBRARY_DIR: "/mnt/usenet/library"
      NZBDAV_CONFIG__REPAIR__ENABLE: "true"
      # Optional streaming tunables. Off/default is deliberate: with the segment
      # cache off, every rewatch and seek re-fetches from the provider, and the
      # VPS stays stateless. Uncomment to trade VPS disk for provider traffic --
      # the default cache path is /config/segment-cache, already inside the
      # data/infinidysk volume, so no new mount is needed.
      # NZBDAV_CONFIG__USENET__SEGMENT_CACHE__ENABLED: "true"
      # NZBDAV_CONFIG__USENET__SEGMENT_CACHE__MAX_GB: "10"
      # Cap provider ingress; 1 Mbit/s = 125,000 bytes/s, 0 = unlimited. Never
      # applies to cache hits or LAN delivery.
      # NZBDAV_CONFIG__USENET__BANDWIDTH_LIMIT_MBPS: "0"
      # Queue tuning. One worker is the upstream default: extra workers share the
      # same provider connection pool and add no capacity, they just spread the
      # same work wider. Raise only if season packs prove to be a bottleneck.
      # NZBDAV_CONFIG__QUEUE__WORKER_COUNT: "1"
      # The stuck-item watchdog fails an item after 3 cumulative stalls
      # (5 minutes of no progress each), and a full article-existence STAT sweep
      # is a long phase. Raise this before blaming the release if the queue
      # reports stall-failures on large season packs.
      # QUEUE_ITEM_STUCK_MINUTES: "5"
      NZBDAV_CONFIG__USENET__PROVIDERS: >-
        ${INFINIDYSK_PROVIDERS:-}
      NZBDAV_CONFIG__ARR__INSTANCES: >-
        ${INFINIDYSK_ARR_INSTANCES:-}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ../../data/infinidysk:/config
      - /mnt/usenet:/mnt/usenet
    stop_grace_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.infinidysk.entrypoints=${INFINIDYSK_ENTRYPOINTS:-https-tailnet}"
      - "traefik.http.routers.infinidysk.rule=Host(`${SUB_DOMAIN_INFINIDYSK}.${DOMAIN}`)"
      - "traefik.http.routers.infinidysk.tls=true"
      - "traefik.http.services.infinidysk.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:3000/healthz > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  default:
    name: internal
    external: true
