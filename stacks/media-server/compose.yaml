x-common: &common
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

x-hardened: &hardened
  <<: *common
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - FOWNER
    - MKNOD
    - SETGID
    - SETUID

services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:10.11.11
    container_name: jellyfin
    <<: *common
    environment:
      PUID: ${ENV_PUID:-1000}
      PGID: ${ENV_PGID:-1000}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ../../data/jellyfin/config:/config
      - /mnt/debrid:/mnt:rslave
    tmpfs:
      - /transcodes
    # No GPU passthrough here: VPS hosts are CPU-only, so Jellyfin transcodes in
    # software. Keep the library direct-play friendly (see docs/services.md).
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.entrypoints=${JELLYFIN_ENTRYPOINTS:-https-tailnet}"
      - "traefik.http.routers.jellyfin.rule=Host(`${SUB_DOMAIN_JELLYFIN}.${DOMAIN}`)"
      - "traefik.http.routers.jellyfin.tls=true"
      # The default is tailnet-only. `just public enable jellyfin` adds the public
      # entrypoint without requiring a Compose file edit.
      # No crowdsec label on purpose: the entrypoints apply crowdsec@file to every
      # router (see traefik.yml) - attaching it here too would run it twice.
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  seerr:
    image: ghcr.io/seerr-team/seerr:v3.4.1
    container_name: seerr
    <<: *common
    init: true
    user: ${ENV_PUID:-1000}:${ENV_PGID:-1000}
    environment:
      LOG_LEVEL: info
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ../../data/seerr/config:/app/config
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.seerr.entrypoints=${SEERR_ENTRYPOINTS:-https-tailnet}"
      - "traefik.http.routers.seerr.rule=Host(`${SUB_DOMAIN_SEERR}.${DOMAIN}`)"
      - "traefik.http.routers.seerr.tls=true"
      - "traefik.http.services.seerr.loadbalancer.server.port=5055"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

  radarr:
    image: lscr.io/linuxserver/radarr:6.3.0
    container_name: radarr
    <<: *hardened
    environment:
      PUID: ${ENV_PUID:-1000}
      PGID: ${ENV_PGID:-1000}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ../../data/radarr:/config
      - /mnt/debrid:/mnt:rslave
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.entrypoints=${RADARR_ENTRYPOINTS:-https-tailnet}"
      - "traefik.http.routers.radarr.rule=Host(`${SUB_DOMAIN_RADARR}.${DOMAIN}`)"
      - "traefik.http.routers.radarr.tls=true"
      # private panel: on the https-tailnet entrypoint, published only on TAILNET_IP
      # (see stacks/traefik/compose.yaml ports + traefik.yml), so it only
      # ever sees traffic that came through the tailnet. No IP allow-list to attach
      # or forget here.
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:7878/ping || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19
    container_name: sonarr
    <<: *hardened
    environment:
      PUID: ${ENV_PUID:-1000}
      PGID: ${ENV_PGID:-1000}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ../../data/sonarr:/config
      - /mnt/debrid:/mnt:rslave
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.entrypoints=${SONARR_ENTRYPOINTS:-https-tailnet}"
      - "traefik.http.routers.sonarr.rule=Host(`${SUB_DOMAIN_SONARR}.${DOMAIN}`)"
      - "traefik.http.routers.sonarr.tls=true"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8989/ping || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.5.2
    container_name: prowlarr
    <<: *hardened
    environment:
      PUID: ${ENV_PUID:-1000}
      PGID: ${ENV_PGID:-1000}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ../../data/prowlarr:/config
      # The stack's own Comet (Local) Cardigann definition (see
      # prowlarr/comet-local.yml) is bind-mounted read-only, so Prowlarr picks
      # it up at startup and `just wire` only registers the indexer.
      - ../../stacks/media-server/prowlarr/comet-local.yml:/config/Definitions/Custom/comet-local.yml:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.entrypoints=${PROWLARR_ENTRYPOINTS:-https-tailnet}"
      - "traefik.http.routers.prowlarr.rule=Host(`${SUB_DOMAIN_PROWLARR}.${DOMAIN}`)"
      - "traefik.http.routers.prowlarr.tls=true"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:9696/ping || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  recyclarr:
    # Syncs the shipped TRaSH-tuned "Direct Play" quality profiles to
    # radarr/sonarr (data/recyclarr/configs/*.yml, applied by `just wire`).
    # No web UI, so no traefik labels. Rootless image: user replaces PUID/PGID.
    image: ghcr.io/recyclarr/recyclarr:8.7.2
    container_name: recyclarr
    <<: *common
    user: ${ENV_PUID:-1000}:${ENV_PGID:-1000}
    depends_on:
      radarr:
        condition: service_healthy
      sonarr:
        condition: service_healthy
    environment:
      CRON_SCHEDULE: "@daily"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ../../data/recyclarr:/config
    # just wire writes /config/secrets.yml after the Arrs are configured. Keep
    # the stock Recyclarr entrypoint; this guard only prevents a noisy restart
    # loop before the first `just wire` run.
    entrypoint: ["/sbin/tini", "--", "/bin/sh", "-c"]
    command:
      - |
        until [ -s /config/secrets.yml ]; do
          sleep 5
        done
        exec /entrypoint.sh
    read_only: true
    tmpfs:
      - /tmp
    # Headless scheduler - no web UI, so no port to ping. The process that keeps
    # the sync schedule alive is supercronic, so healthy == that scheduler is
    # running. The start_period covers the initial `just wire` setup and the
    # time before supercronic appears.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x supercronic || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

  bazarr:
    image: lscr.io/linuxserver/bazarr:1.6.0
    container_name: bazarr
    <<: *hardened
    environment:
      PUID: ${ENV_PUID:-1000}
      PGID: ${ENV_PGID:-1000}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ../../data/bazarr/config:/config
      - /mnt/debrid:/mnt:rslave
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bazarr.entrypoints=${BAZARR_ENTRYPOINTS:-https-tailnet}"
      - "traefik.http.routers.bazarr.rule=Host(`${SUB_DOMAIN_BAZARR}.${DOMAIN}`)"
      - "traefik.http.routers.bazarr.tls=true"
      - "traefik.http.services.bazarr.loadbalancer.server.port=6767"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:6767/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  decypharr:
    image: cy01/blackhole:v2.5
    container_name: decypharr
    <<: *common
    security_opt:
      # FUSE mounts via setuid /usr/bin/fusermount3; the x-common no-new-privileges
      # anchor would block the privilege raise and DFS fails to mount with
      # "fusermount3: mount failed: Operation not permitted". Decypharr ships
      # without it (see docs/decypharr.md).
      - apparmor:unconfined
    environment:
      PUID: ${ENV_PUID:-1000}
      PGID: ${ENV_PGID:-1000}
    volumes:
      - /mnt/debrid:/mnt:rshared
      - ../../data/decypharr/configs:/app
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse:rwm
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.decypharr.entrypoints=${DECYPHARR_ENTRYPOINTS:-https-tailnet}"
      - "traefik.http.routers.decypharr.rule=Host(`${SUB_DOMAIN_DECYPHARR}.${DOMAIN}`)"
      - "traefik.http.routers.decypharr.tls=true"
      - "traefik.http.services.decypharr.loadbalancer.server.port=8282"

  comet:
    # Debrid/torrent search add-on used as the stack's self-hosted indexer
    # ("Comet (Local)" cardigann, see docs/indexers.md). The DMM ingester loads
    # hashlists into comet's own Postgres and SCRAPE_DMM searches that local
    # cache. No web UI worth exposing, so no Traefik labels and no published
    # ports: Prowlarr alone talks to it at http://comet:8000 over the internal
    # network. The one-time first DMM ingestion is the heavy one (10-30 min CPU,
    # resumable on restart); subsequent cycles (DMM_INGEST_INTERVAL) are
    # incremental. Upstream publishes no version tags, so the image is pinned by
    # digest (index of `latest`, v2.58.0).
    image: g0ldyy/comet@sha256:dca62133336e02784d02aaad861381820674d1c8e3e98a03797610b81ee4defe
    container_name: comet
    <<: *common
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      comet-postgres:
        condition: service_healthy
    environment:
      DATABASE_TYPE: postgresql
      DATABASE_URL: postgresql://comet:${COMET_POSTGRES_PASSWORD:?set COMET_POSTGRES_PASSWORD in stacks/media-server/.env}@comet-postgres:5432/comet
      # Tailnet-visible dashboard (https://comet.<DOMAIN>). Upstream also has a
      # CONFIGURE_PAGE_PASSWORD for /configure; left unset - the tailnet is the
      # gate, exactly like the other panels.
      ADMIN_DASHBOARD_PASSWORD: ${ADMIN_DASHBOARD_PASSWORD:?set ADMIN_DASHBOARD_PASSWORD in stacks/media-server/.env}
      # Scrapers: DMM from Comet's local hashlist DB, plus public MediaFusion
      # (mediafusion.elfhosted.com). Torrentio stays off: torrentio.strem.fun
      # Cloudflare-challenges VPS/datacenter IPs.
      SCRAPE_DMM: "true"
      DMM_INGEST_ENABLED: "true"
      DMM_INGEST_CONCURRENT_WORKERS: "1"
      SCRAPE_MEDIAFUSION: "true"
      SCRAPE_TORRENTIO: "false"
      # Keep the process pool lean; raise alongside DMM_INGEST_CONCURRENT_WORKERS.
      EXECUTOR_MAX_WORKERS: "1"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ../../data/comet:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.comet.entrypoints=${COMET_ENTRYPOINTS:-https-tailnet}"
      - "traefik.http.routers.comet.rule=Host(`${SUB_DOMAIN_COMET}.${DOMAIN}`)"
      - "traefik.http.routers.comet.tls=true"
      # Comet serves its admin dashboard at the app root, sharing this port with
      # /stream, /manifest.json and /configure, so the whole 8000 host is routed.
      - "traefik.http.services.comet.loadbalancer.server.port=8000"
    # The image ships its own HEALTHCHECK (python -m comet.healthcheck), so no
    # healthcheck block is needed here.

  comet-postgres:
    # Comet's index database. shm_size is required: the default 64m fails the
    # bulk DMM hashlist ingestion. Never publish the port - unlike every other
    # container, this one has real credentials on Postgres.
    # PG 18+ images use pg_ctlcluster-compatible layouts and require a single
    # mount at /var/lib/postgresql (data lands in /var/lib/postgresql/<major>/docker).
    image: postgres:18.6-alpine3.24
    container_name: comet-postgres
    <<: *common
    shm_size: 256m
    environment:
      POSTGRES_DB: comet
      POSTGRES_USER: comet
      POSTGRES_PASSWORD: ${COMET_POSTGRES_PASSWORD:?set COMET_POSTGRES_PASSWORD in stacks/media-server/.env}
    volumes:
      - ../../data/comet-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comet -d comet"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  default:
    name: internal
    external: true
