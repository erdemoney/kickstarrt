# Custom Cardigann definition for the stack's self-hosted Comet instance
# (stacks/media-server/compose.yaml). `just wire` copies this into prowlarr's
# Definitions/Custom dir and registers the "Comet (Local)" indexer against the
# internal-only service URL http://comet:8000 - no GUI step needed.
#
# Comet is deliberately unconfigured here (no debrid provider: Decypharr turns
# the selected magnet into an instant-release download), so this definition
# queries Comet's native Torznab endpoint (/torznab/api) with that default
# config:
#   - Movies (Newznab 2000): t=movie or t=search    (q)
#   - TV (Newznab 5000):     t=tvsearch or t=search (q, season, ep)
# Comet resolves q to IMDb through its own metadata providers, including a "tt..."
# id passed in q, so the IMDb id is folded into q when present.
#
# The per-path `t` switches between the function-specific calls and Comet's
# generic `t=search`. Cardigann (Prowlarr) only supports and/or/eq/ne, bare
# variables, and if/else/end over a single variable, and empty inputs are
# dropped before the request is sent:
#   - With a term (or IMDb id) -> t=movie / t=tvsearch, the explicit query.
#   - Without either (t=search&cat=<n>) -> Comet's "recent" feed. Sonarr/Radarr
#     validate an indexer (and poll RSS) with exactly this empty-query t=search
#     on their configured categories; Comet answers with recently-scraped
#     releases so both Arr apps accept and keep the indexer synced.
# cat is pinned so the recent feed is deterministic for each media type (movies
# vs series) and the category checks in the Arr apps always see a match.
id: comet-local
name: Comet (Local)
description: "Custom Prowlarr indexer for the stack's self-hosted Comet search add-on."
language: en-US
type: public
encoding: UTF-8
followredirect: false
testlinktorrent: false
requestDelay: 15
links:
  - http://comet:8000

caps:
  categories:
    Movies: Movies
    TV: TV
  modes:
    search: [q]
    movie-search: [q, imdbid]
    tv-search: [q, imdbid, season, ep]
  allowrawsearch: false

search:
  paths:
    # Prefer the full "tt..." IMDb id when one was provided, otherwise the
    # matched title. Comet accepts both through q. Empty season/ep values are
    # dropped by Prowlarr, and Comet errors on an empty season=/ep=, so those
    # params are only present for actual episode searches.
    - path: /torznab/api
      method: get
      inputs:
        t: "{{ if .Query.Q }}movie{{ else }}search{{ end }}"
        q: "{{ or .Query.IMDBID .Query.Q }}"
        cat: "2000"
      response:
        type: xml
      categories: [Movies]

    - path: /torznab/api
      method: get
      inputs:
        t: "{{ if .Query.Q }}tvsearch{{ else }}search{{ end }}"
        q: "{{ or .Query.IMDBID .Query.Q }}"
        cat: "5000"
        season: "{{ .Query.Season }}"
        ep: "{{ .Query.Ep }}"
      response:
        type: xml
      categories: [TV]

  rows:
    selector: channel item
    missingAttributeEqualsNoResults: true

  fields:
    title:
      selector: title
      filters:
        # Comet's results are debrid-ready cache candidates. Keep this marker
        # in the release title so both Arr applications can score them equally.
        - name: append
          args: " [DEBRID-CACHED]"
    magnet:
      selector: link
    infohash:
      selector: guid
    size:
      selector: size
    category:
      selector: category
    seeders:
      text: "30"
    leechers:
      text: "0"
