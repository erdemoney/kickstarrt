# Custom Cardigann definition for the stack's self-hosted Comet instance
# (stacks/media-server/compose.yaml). `just wire` copies this into prowlarr's
# Definitions/Custom dir and registers the "Comet (Local)" indexer against the
# internal-only service URL http://comet:8000 - no GUI step needed.
#
# Comet is deliberately unconfigured here (no debrid provider: Decypharr turns
# the selected magnet into an instant-release download), so this definition
# queries Comet's native Torznab endpoint (/torznab/api) with that default
# config:
#   - Movies (Newznab 2000): t=movie    (q, imdbid)
#   - TV (Newznab 5000):     t=tvsearch (q, imdbid, season, ep)
# Comet resolves plain-text titles to IMDb through its own metadata providers,
# so q-only searches work; imdbid still gives the most precise hits. Cardigann
# search paths are relative to the indexer's baseUrl, and inputs become
# URL-encoded query parameters.
id: comet-local
name: Comet (Local)
description: "Custom Prowlarr indexer for the stack's self-hosted Comet search add-on."
language: en-US
type: public
encoding: UTF-8
followredirect: false
testlinktorrent: false
requestDelay: 15
links:
  - http://comet:8000

caps:
  categories:
    Movies: Movies
    TV: TV
  modes:
    search: [q]
    movie-search: [q, imdbid]
    tv-search: [q, imdbid, season, ep]
  allowrawsearch: false

search:
  paths:
    # Comet rejects both an empty imdbid= parameter and digit-only ids, so the
    # full "tt..." id (.Query.IMDBID) is only appended to the path when one was
    # provided; inputs add the remaining encoded query params afterwards.
    - path: /torznab/api{{ if .Query.IMDBID }}?imdbid={{ .Query.IMDBID }}&{{ end }}
      method: get
      inputs:
        t: movie
        q: "{{ .Query.Q }}"
      response:
        type: xml
      categories: [Movies]

    - path: /torznab/api{{ if .Query.IMDBID }}?imdbid={{ .Query.IMDBID }}&{{ end }}
      method: get
      inputs:
        t: tvsearch
        q: "{{ .Query.Q }}"
        season: "{{ if .Query.Season }}{{ .Query.Season }}{{ end }}"
        ep: "{{ if .Query.Ep }}{{ .Query.Ep }}{{ end }}"
      response:
        type: xml
      categories: [TV]

  rows:
    selector: channel item
    missingAttributeEqualsNoResults: true

  fields:
    title:
      selector: title
      filters:
        # Comet's results are debrid-ready cache candidates. Keep this marker
        # in the release title so both Arr applications can score them equally.
        - name: append
          args: " [DEBRID-CACHED]"
    magnet:
      selector: link
    infohash:
      selector: guid
    size:
      selector: size
    category:
      selector: category
    seeders:
      text: "30"
    leechers:
      text: "0"
