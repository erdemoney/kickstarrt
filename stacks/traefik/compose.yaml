x-base: &base
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  pids_limit: 512

services:
  traefik:
    image: traefik:v3.7.13
    container_name: traefik
    <<: *base
    cap_drop:
      - ALL
    cap_add:
      # Persistent host files are owned by the configured VPS user; Traefik
      # remains root in-container and needs to write ACME state/logs.
      - DAC_OVERRIDE
      # It binds :80, :443 and :8443 inside the container.
      - NET_BIND_SERVICE
    environment:
      CF_DNS_API_TOKEN: ${CLOUDFLARE_DNS_TOKEN}
      TRAEFIK_DASHBOARD_CREDENTIALS: ${TRAEFIK_DASHBOARD_CREDENTIALS}
    # dynamic.yml resolves the CrowdSec key with {{ env "..." }}, so the variable
    # has to exist in Traefik's own environment - env_file injects the whole file.
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Specific-IP publishes, one per entrypoint: docker binds each mapping to
      # its own host IP, so nothing listens on 0.0.0.0:80/443. PUBLIC_BIND (the
      # provider-mapped IP) reaches the container's public https listener (:8443,
      # traefik.yml: PUBLIC_BIND:80 -> :80 redirect, PUBLIC_BIND:443 ->
      # :8443 = the https entrypoint, which only public apps use). TAILNET_IP
      # reaches the https-tailnet listener (:443, panels only). Because the two
      # listeners are different sockets, a panel Host: header coming in on the
      # public IP lands on an entrypoint with no router for it (404) - privacy at
      # the socket layer, no per-router IP allow-list to maintain.
      - "${PUBLIC_BIND}:80:80"
      - "${PUBLIC_BIND}:443:8443"
      - "${TAILNET_IP}:80:80"
      - "${TAILNET_IP}:443:443"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../../data/traefik/traefik.yml:/traefik.yml:ro
      - ../../data/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ../../data/traefik/acme.json:/acme.json
      - ../../data/traefik/logs:/var/log/traefik
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`${SUB_DOMAIN_TRAEFIK}.${DOMAIN}`)"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_DASHBOARD_CREDENTIALS}"
      - "traefik.http.middlewares.sslheader.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.traefik-secure.entrypoints=https-tailnet"
      - "traefik.http.routers.traefik-secure.rule=Host(`${SUB_DOMAIN_TRAEFIK}.${DOMAIN}`)"
      - "traefik.http.routers.traefik-secure.middlewares=traefik-auth"
      - "traefik.http.routers.traefik-secure.tls=true"
      - "traefik.http.routers.traefik-secure.tls.certresolver=cloudflare"
      - "traefik.http.routers.traefik-secure.tls.domains[0].main=${DOMAIN}"
      - "traefik.http.routers.traefik-secure.tls.domains[0].sans=*.${DOMAIN}"
      - "traefik.http.routers.traefik-secure.service=api@internal"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.1
    container_name: crowdsec
    <<: *base
    cap_drop:
      - ALL
    cap_add:
      # The image entrypoint repairs ownership and writes state in bind mounts.
      - CHOWN
      - DAC_OVERRIDE
    environment:
      COLLECTIONS: "crowdsecurity/traefik crowdsecurity/http-cve"
      GID: "0"
      BOUNCER_KEY_TRAEFIK: ${CROWDSEC_BOUNCER_API_KEY}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ../../data/crowdsec/config:/etc/crowdsec
      - ../../data/crowdsec/data:/var/lib/crowdsec/data
      - ../../data/traefik/logs:/logs:ro
      - ../../data/crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
    networks:
      - internal
    labels:
      - "traefik.enable=false"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  coredns:
    image: coredns/coredns:1.12.3
    container_name: coredns
    <<: *base
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in the stack .env}
      TAILNET_IP: ${TAILNET_IP:?set TAILNET_IP in the stack .env}
    # Tailnet DNS resolver (see docs/tailnet.md): answers *.DOMAIN with the VPS's
    # tailnet IP so admin panels resolve by name on the tailnet. Bound to the
    # tailnet IP only (systemd-resolved holds 127.0.0.53). Published ports ride
    # Docker's FORWARD chain, which UFW's INPUT rules never inspect - the ufw
    # "allow 53 from 100.64.0.0/10" rule only bites once the ufw-docker gate
    # routes forwarded traffic through ufw-user-forward (see docs/quickstart.md).
    ports:
      - ${TAILNET_IP:?set TAILNET_IP in the stack .env}:53:53/udp
      - ${TAILNET_IP:?set TAILNET_IP in the stack .env}:53:53/tcp
    command: ["-conf", "/Corefile"]
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ../../data/coredns/Corefile:/Corefile:ro
    networks:
      - internal
    labels:
      - "traefik.enable=false"
    healthcheck:
      test: ["CMD", "/coredns", "-version"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  internal:
    external: true
